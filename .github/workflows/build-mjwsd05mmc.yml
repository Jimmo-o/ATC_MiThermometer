name: build-mjwsd05mmc

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "makefile"
      - ".github/workflows/build-mjwsd05mmc.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install 32-bit runtime deps (tc32 gcc 4.5.1 is old)
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq libc6-i386 lib32stdc++6 || true

      - name: Fetch tc32 cross toolchain
        run: |
          curl -sSL -o /tmp/tc32.zip \
            https://codeload.github.com/flyskywhy/tc32/zip/refs/heads/linux
          rm -rf /tmp/tc32x && mkdir -p /tmp/tc32x
          unzip -q /tmp/tc32.zip -d /tmp/tc32x
          root="$(find /tmp/tc32x -mindepth 1 -maxdepth 1 -type d | head -1)"
          mkdir -p SDK/tools/linux
          rm -rf SDK/tools/linux/tc32
          mv "$root" SDK/tools/linux/tc32
          find SDK/tools/linux/tc32 -type f -name 'tc32-elf-*' -exec chmod +x {} +
          SDK/tools/linux/tc32/bin/tc32-elf-gcc --version | head -1

      - name: Build PATCHED (registered bit set)
        run: |
          grep -n 'fctrl.word = 0x59' src/mi_beacon.c
          make -s -j PROJECT_NAME=BTH_v59 POJECT_DEF="-DDEVICE_TYPE=DEVICE_MJWSD05MMC"
          cp BTH_v59.bin /tmp/BTH_v59_patched.bin
          sha256sum BTH_v59.bin

      - name: Disassemble PATCHED elf and confirm the fctrl immediates
        run: |
          OD=SDK/tools/linux/tc32/bin/tc32-elf-objdump
          $OD -d out/BTH_v59.elf > /tmp/patched.lst
          echo "--- instructions loading the four fctrl constants ---"
          grep -inE '0x(5958|5948|5950|5940)\b' /tmp/patched.lst | head -20
          echo "--- any leftover OLD constants (0x5858/0x5848/0x5850/0x5840) ---"
          grep -inE '0x(5858|5848|5850|5840)\b' /tmp/patched.lst | head -20
          cp out/BTH_v59.elf /tmp/BTH_v59_patched.elf

      - name: Revert the 4 constants and build BASELINE
        run: |
          rm -f BTH_v59.bin
          rm -rf out
          sed -i 's/fctrl\.word = 0x5958;/fctrl.word = 0x5858;/;
                  s/fctrl\.word = 0x5948;/fctrl.word = 0x5848;/;
                  s/fctrl\.word = 0x5950;/fctrl.word = 0x5850;/;
                  s/fctrl\.word = 0x5940;/fctrl.word = 0x5840;/' src/mi_beacon.c
          echo "--- after revert (must show 0x58xx) ---"
          grep -n 'fctrl.word = 0x5' src/mi_beacon.c
          make -s -j PROJECT_NAME=BTH_v59 POJECT_DEF="-DDEVICE_TYPE=DEVICE_MJWSD05MMC"
          cp BTH_v59.bin /tmp/BTH_v59_baseline.bin
          sha256sum BTH_v59.bin

      - name: Diff patched vs baseline
        run: |
          python3 - <<'PY'
          a = open('/tmp/BTH_v59_baseline.bin','rb').read()
          b = open('/tmp/BTH_v59_patched.bin','rb').read()
          print(f'baseline {len(a)} bytes, patched {len(b)} bytes, delta {len(b)-len(a):+d}')
          # common prefix / suffix -> localise the change even if sizes differ
          p = 0
          while p < min(len(a), len(b)) and a[p] == b[p]:
              p += 1
          s = 0
          while s < min(len(a), len(b)) - p and a[len(a)-1-s] == b[len(b)-1-s]:
              s += 1
          print(f'common prefix ends at 0x{p:05x}, common suffix starts at '
                f'baseline 0x{len(a)-s:05x} / patched 0x{len(b)-s:05x}')
          mid_a = a[p:len(a)-s]; mid_b = b[p:len(b)-s]
          print(f'changed region: baseline {len(mid_a)}B -> patched {len(mid_b)}B')
          print('baseline region head:', mid_a[:48].hex(' '))
          print('patched  region head:', mid_b[:48].hex(' '))
          # locate the fctrl immediates in each build
          for name, img in (('baseline', a), ('patched', b)):
              for want in (b'\x58\x58', b'\x58\x59', b'\x48\x58', b'\x48\x59',
                           b'\x50\x58', b'\x50\x59', b'\x40\x58', b'\x40\x59'):
                  offs = [i for i in range(len(img)) if img[i:i+2] == want]
                  if len(offs) <= 6:
                      print(f'  {name:8} {want[::-1].hex()} at ' + ' '.join(f'{o:#x}' for o in offs))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: BTH_v59-patched-and-baseline
          path: |
            /tmp/BTH_v59_patched.bin
            /tmp/BTH_v59_baseline.bin
            /tmp/BTH_v59_patched.elf
            /tmp/patched.lst
          if-no-files-found: error
